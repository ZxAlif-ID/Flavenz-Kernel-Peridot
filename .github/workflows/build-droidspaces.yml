name: Build Kernel - Peridot (Guidix vs ACK Matrix)

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "Trigger Guidix vs ACK Kernel Build Matrix"
        required: false
        default: "all"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flavor: [guidix-full, ack-full]
    permissions:
      contents: write
    env:
      ARCH: arm64
      KERNEL_COMMIT: 0c3d559bcd85
      KERNELSU_VERSION: v3.3.0
      SUSFS_VERSION: v2.1.0
      FLAVOR: ${{ matrix.flavor }}
      # Duck Detector Build Time Drift & Mismatch Fix
      KBUILD_BUILD_USER: "builder"
      KBUILD_BUILD_HOST: "droidspaces-ci"
      KBUILD_BUILD_TIMESTAMP: "Mon Sep  7 12:00:00 UTC 2026"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            python3 python3-pip cpio pahole \
            lz4 zstd libzstd-dev curl git zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu

      - name: Setup Neutron Clang
        run: |
          set -euo pipefail
          rm -rf "$HOME/clang"; mkdir -p "$HOME/clang"; cd "$HOME/clang"
          curl -fsSLO "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst"
          tar -I zstd -xf "neutron-clang-30062026.tar.zst" && rm -f "neutron-clang-30062026.tar.zst"
          curl -fsSLo antman "https://raw.githubusercontent.com/Neutron-Toolchains/antman/0b32c45e3ad83a953b4bc3fd2feb4ad3cc87c1e8/antman"
          chmod +x antman
          for i in 1 2 3 4; do
            ./antman --patch=glibc && break
            [ "$i" = 4 ] && { echo "::error::antman failed 4 times"; exit 1; }
            echo "antman attempt $i failed; retrying in $((i*20))s"; sleep $((i*20))
          done
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Clone Guidix Source
        if: ${{ matrix.flavor == 'guidix-full' }}
        run: |
          rm -rf kernel
          git clone --depth=1 -b 16.2 \
            https://github.com/GuidixX/kernel_xiaomi_sm8635 \
            kernel

      - name: Clone Pure ACK Source + Defconfig
        if: ${{ matrix.flavor == 'ack-full' }}
        run: |
          # Clone android.googlesource.com sering putus di tengah jalan di runner
          # ("fetch-pack: unexpected disconnect", "early EOF", exit 128) — flaky,
          # bukan bug repo. Retry dengan backoff; konfigurasi low-speed supaya
          # clone macet tidak menggantung sampai timeout job.
          rm -rf kernel
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
          ACK_OK=false
          for i in 1 2 3; do
            echo "ACK clone attempt $i/3"
            if git clone --filter=blob:none --no-checkout \
              https://android.googlesource.com/kernel/common \
              kernel; then
              ACK_OK=true
              break
            fi
            rm -rf kernel
            [ "$i" = 3 ] || sleep $((i * 30))
          done
          [ "$ACK_OK" = true ] || { echo "::error::ACK clone failed after 3 attempts"; exit 1; }
          cd kernel
          # Checkout commit juga bisa kena flake jaringan yang sama — retry.
          CO_OK=false
          for i in 1 2 3; do
            echo "ACK checkout attempt $i/3"
            if git checkout $KERNEL_COMMIT; then
              CO_OK=true
              break
            fi
            sleep $((i * 15))
          done
          [ "$CO_OK" = true ] || { echo "::error::ACK checkout failed after 3 attempts"; exit 1; }
          cd ..

          echo "Attempting to clone peridot-defconfig with branch fallback..."
          CLONED=false
          for branch in 17 main theettam-2.8 theettam-2.7; do
            echo "Trying branch: $branch"
            if git clone --depth=1 -b "$branch" https://github.com/Mohithash/kernel_xiaomi_sm8635 peridot-defconfig 2>/dev/null; then
              echo "Successfully cloned using branch: $branch"
              CLONED=true
              break
            fi
            rm -rf peridot-defconfig
          done
          if [ "$CLONED" = false ]; then
            echo "::error::Failed to clone peridot-defconfig from any candidate branch!"
            exit 1
          fi
          mkdir -p kernel/arch/arm64/configs/vendor
          cp peridot-defconfig/arch/arm64/configs/gki_defconfig \
            kernel/arch/arm64/configs/gki_defconfig
          cp peridot-defconfig/arch/arm64/configs/vendor/peridot_GKI.config \
            kernel/arch/arm64/configs/vendor/peridot_GKI.config
          cp peridot-defconfig/scripts/Makefile.extrawarn \
            kernel/scripts/Makefile.extrawarn
          echo 'KBUILD_CFLAGS += $(call cc-disable-warning, uninitialized-const-pointer)' \
            >> kernel/scripts/Makefile.extrawarn
          rm -rf peridot-defconfig

      - name: Apply Droidspaces & Container Configs
        run: |
          cd kernel
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          if [ -f "arch/arm64/configs/vendor/peridot_GKI.config" ]; then
            CONFIG_FILE="arch/arm64/configs/vendor/peridot_GKI.config"
          fi
          printf '%s\n' \
            CONFIG_SYSVIPC=y \
            CONFIG_PID_NS=y \
            CONFIG_IPC_NS=y \
            CONFIG_USER_NS=y \
            CONFIG_NET_NS=y \
            CONFIG_DEVTMPFS=y \
            CONFIG_DEVTMPFS_MOUNT=y \
            CONFIG_POSIX_MQUEUE=y \
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y \
            CONFIG_TMPFS_POSIX_ACL=y \
            CONFIG_TMPFS_XATTR=y \
            CONFIG_LTO=y \
            CONFIG_LTO_CLANG=y \
            CONFIG_LTO_CLANG_THIN=y \
            CONFIG_KALLSYMS=y \
            CONFIG_KALLSYMS_ALL=y \
            >> "$CONFIG_FILE"
          cd ..

      - name: Apply kABI SYSVIPC patch (GKI 6.1)
        run: |
          wget -q "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" \
            -O sysvipc_kabi.patch
          cd kernel
          git apply ../sysvipc_kabi.patch || echo "kABI patch applied with notes"
          cd ..
          rm sysvipc_kabi.patch

      - name: Setup KernelSU Next (pershoot/dev-susfs)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" \
            | bash -s $KERNELSU_VERSION

      - name: Setup SUSFS
        run: |
          git clone --depth=1 -b gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu \
            susfs4ksu
          cp susfs4ksu/kernel_patches/fs/susfs.c kernel/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs*.h kernel/include/linux/
          cd kernel
          git apply ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch \
            || echo "SUSFS patch applied with warnings or skipped"

      - name: Build kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          CLANG_BIN=$HOME/clang/bin

          MAKE_FLAGS=(
            -j$(nproc)
            O=out
            ARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            LD=$CLANG_BIN/ld.lld
            AR=$CLANG_BIN/llvm-ar
            NM=$CLANG_BIN/llvm-nm
            OBJCOPY=$CLANG_BIN/llvm-objcopy
            OBJDUMP=$CLANG_BIN/llvm-objdump
            STRIP=$CLANG_BIN/llvm-strip
            KCFLAGS="-Wno-default-const-init-var-unsafe -march=armv9.2-a+crypto+dotprod"
          )

          cd kernel
          make "${MAKE_FLAGS[@]}" gki_defconfig
          if [ -f "arch/arm64/configs/vendor/peridot_GKI.config" ]; then
            make "${MAKE_FLAGS[@]}" vendor/peridot_GKI.config
          fi
          make "${MAKE_FLAGS[@]}" Image Image.gz dtbs

      - name: Package AnyKernel3
        run: |
          DATE=$(date +%Y%m%d)
          # Variabel shell biasa — bukan $GITHUB_ENV. GITHUB_ENV hanya terlihat
          # oleh step BERIKUTNYA, jadi sebelumnya ${ZIPPATH} kosong di step ini:
          # `zip -r9 "" ...` exit 0 dan menulis file tersembunyi `.zip`, step
          # tampak sukses, tapi tidak ada zip yang di-upload.
          if [ "${FLAVOR}" = "guidix-full" ]; then
            ZIPNAME="Peridot-Kernel-Guidix-KSUNext-${KERNELSU_VERSION}-SUSFS-${SUSFS_VERSION}-droidspaces-${DATE}.zip"
          elif [ "${FLAVOR}" = "ack-full" ]; then
            ZIPNAME="Peridot-Kernel-ACK-KSUNext-${KERNELSU_VERSION}-SUSFS-${SUSFS_VERSION}-droidspaces-${DATE}.zip"
          else
            echo "::error::Unknown FLAVOR '${FLAVOR}'"; exit 1
          fi
          ZIPPATH="${GITHUB_WORKSPACE}/${ZIPNAME}"

          echo "ZIPNAME=${ZIPNAME}" >> $GITHUB_ENV
          echo "ZIPPATH=${ZIPPATH}" >> $GITHUB_ENV
          echo "RELEASEDATE=${DATE}" >> $GITHUB_ENV

          # AnyKernel3 sudah di-commit di repo ini (folder anykernel/) — pola yang
          # dipakai workflow Mohithash yang SUKSES (Kernel_F6): tidak ada git clone
          # saat packaging. Git clone di step ini gagal "exit code 3" di runner
          # (osm0sis di run #5, fork sendiri di run #6), padahal sama clone sukses
          # di mesin lokal — jadi sumber masalahnya runner, bukan repo-nya.
          cd anykernel

          # block=boot + is_slot_device=auto: identical to Mohithash's anykernel.sh
          # proven to flash & boot on peridot (incl. OrangeFox R12 — logs/recovery.log)
          printf '%s\n' \
            '# AnyKernel3 Ramdisk Mod Script' \
            '# osm0sis @ xda-developers' \
            '' \
            '## AnyKernel setup' \
            '# begin properties' \
            "properties() { '" \
            "kernel.string=Flavenz Kernel (${FLAVOR}) by ZxAlif-ID" \
            'do.devicecheck=1' \
            'do.modules=0' \
            'do.systemless=1' \
            'do.cleanup=1' \
            'do.cleanuponabort=0' \
            'device.name1=peridot' \
            'device.name2=peridot_global' \
            "'; } # end properties" \
            '' \
            '## AnyKernel install' \
            '# boot shell variables' \
            'block=boot;' \
            'is_slot_device=auto;' \
            'ramdisk_compression=auto;' \
            'patch_vbmeta_flag=auto;' \
            'no_magisk_check=1;' \
            '' \
            '# import functions/variables and setup patching (DO NOT REMOVE)' \
            '. tools/ak3-core.sh;' \
            '' \
            "ui_print \"Flashing Flavenz Kernel (${FLAVOR})...\";" \
            'split_boot;' \
            'flash_boot;' \
            > anykernel.sh

          cp ../kernel/out/arch/arm64/boot/Image ./Image

          zip -r9 "${ZIPPATH}" . -x "*.git*" "LICENSE.txt" > /dev/null
          # Verifikasi keras: zip harus benar-benar ada dan tidak kosong.
          [ -s "${ZIPPATH}" ] || { echo "::error::zip not created: ${ZIPPATH}"; exit 1; }
          ls -lh "${ZIPPATH}"
          echo "Successfully created ${ZIPNAME}"

      - name: Upload Kernel Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Peridot-Kernel-${{ matrix.flavor }}-KSUNext-${{ env.RELEASEDATE || 'release' }}
          path: Peridot-Kernel-*.zip
          if-no-files-found: error

  release:
    name: Publish to GitHub Releases
    needs: [build]
    # release hanya jika kedua job matrix sukses: needs membuat job ini menunggu
    # SEMUA kombinasi matrix selesai; jika ada yang gagal, job ini tidak jalan.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all built zips
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify zips & prepare release body
        env:
          KSU_VER: v3.3.0
          SUSFS_VER: v2.1.0
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # v4 artifacts bisa memuat zip pembungkus per job — ekstrak dulu semua
          # pembungkus agar tersisa HANYA zip flashable AnyKernel3 di root.
          shopt -s nullglob
          for f in artifacts/*.zip; do
            if unzip -l "$f" | grep -q '\.zip$'; then
              d="${f%.zip}__unwrapped"; mkdir -p "$d"
              unzip -qo "$f" -d "$d"
              rm -f "$f"
              find "$d" -name '*.zip' -exec mv {} artifacts/ \;
              rm -rf "$d"
            fi
          done
          shopt -u nullglob
          echo "=== zip flashable di artifacts/ ==="
          ls -lh artifacts/
          COUNT=$(find artifacts -maxdepth 1 -name 'Peridot-Kernel-*.zip' | wc -l)
          if [ "${COUNT}" -ne 2 ]; then
            echo "::error::expected exactly 2 flashable zips, found ${COUNT}"; exit 1
          fi
          cd artifacts
          # checksum untuk verifikasi integritas sebelum flash
          sha256sum Peridot-Kernel-*.zip > SHA256SUMS.txt
          # tanggal build diambil dari nama zip → dipakai sebagai tag release
          DATE=$(ls Peridot-Kernel-*-droidspaces-*.zip | head -n1 | grep -oE '[0-9]{8}' | tail -n1)
          echo "REL_TAG=Flavenz-${DATE}" >> "$GITHUB_ENV"
          {
            echo "REL_BODY<<RELEASE_EOF"
            echo "## Flavenz Kernel for POCO F6 (Peridot) — build ${DATE}"
            echo ""
            echo "Dua zip flashable AnyKernel3 (pilih salah satu flavor):"
            echo ""
            echo "| Flavor | Base |"
            echo "|---|---|"
            echo "| \`guidix-full\` | GuidixX 16.2 (ACK + Qualcomm CLO) — closest to stock, proven boot |"
            echo "| \`ack-full\` | ACK android14-6.1 @ \`0c3d559bcd85\` + defconfig Mohithash |"
            echo ""
            echo "### Isi (tanpa zip dalam zip — langsung flashable)"
            echo "- \`${KSU_VER}\` KernelSU Next (pershoot dev-susfs, via init_boot)"
            echo "- SUSFS \`${SUSFS_VER}\`"
            echo "- Droidspaces (container) support"
            echo "- \`SHA256SUMS.txt\` tersedia untuk verifikasi integritas"
            echo ""
            echo "### Peringatan"
            echo "> Project pribadi, AS-IS tanpa garansi. Segala kesalahan/error/kerusakan"
            echo "> sistem adalah tanggung jawab masing-masing. Keamanan belum dapat"
            echo "> dipastikan. Backup boot & init_boot sebelum flash."
            echo ""
            echo "### Cara flash"
            echo "1. Download SATU zip flavor di bawah (tidak perlu diekstrak lagi)"
            echo "2. (Disarankan) Reboot ke OS dulu, lalu kembali ke recovery — agar \`/apex\` tidak ter-mount dari system"
            echo "3. Flash via TWRP/OrangeFox/NEBULA → Wipe Dalvik/Cache → Reboot"
            echo ""
            echo "CI run: ${RUN_URL}"
            echo "RELEASE_EOF"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd artifacts
          if gh release view "${REL_TAG}" -R "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${REL_TAG} sudah ada — hapus dulu supaya isi terbaru"
            gh release delete "${REL_TAG}" -R "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi
          gh release create "${REL_TAG}" \
            -R "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Flavenz Kernel Peridot — ${REL_TAG}" \
            --notes-file <(echo "${REL_BODY}") \
            Peridot-Kernel-*.zip SHA256SUMS.txt
          echo "=== release terbit ==="
          gh release view "${REL_TAG}" -R "${GITHUB_REPOSITORY}" --json name,tagName,assets \
            --jq '"\(.name) [\(.tagName)] assets: " + ([.assets[].name] | join(", "))'
